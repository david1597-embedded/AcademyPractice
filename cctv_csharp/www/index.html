<!DOCTYPE html>
<html>
<head>
    <title>CCTV streaming</title>
    <style>
        canvas {
            border: 1px solid black;
            margin: 10px;
        }

        .camera-container {
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>CCTV STREAM</h1>
    <div class="camera-container">
        <canvas id="CCTV1" width="640" height="480"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('CCTV1');
        const context = canvas.getContext('2d');
        let ws;

        function connectWebSocket() {
            ws = new WebSocket('ws://' + window.location.hostname + ':8080');
            ws.onopen = () => console.log('WebSocket connected');
            ws.onmessage = (event) => {
                try {
                    const [cameraId, dataUrl] = event.data.split('|');
                    const img = new Image();
                    img.src = dataUrl;
                    img.onload = () => {
                        context.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                } catch (e) {
                    console.error('message error:', e);
                }
            };
            ws.onclose = () => {
                console.log('WebSocket Exit, Retry...');
                setTimeout(connectWebSocket, 5000);
            };
            ws.onerror = (error) => console.error('WebSocket Error:', error);
        }
        connectWebSocket();
    </script>
</body>
</html>
